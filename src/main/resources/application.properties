# Имя приложения
spring.application.name=antipin_service_for_dodeb

# Порт веб-сервера (по умолчанию 8080, либо из переменной PORT)
server.port=${PORT:8080}

# Включение плавного завершения работы (Graceful Shutdown)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Параметры сервиса для эндпоинта /health
app.service-name=${SERVICE_NAME:antipin_service_for_dodeb}
app.version=${APP_VERSION:1.0.0}
