# Имя приложения
spring.application.name=antipin_service_for_dodeb

# Порт веб-сервера (по умолчанию 8080, либо из переменной PORT)
server.port=${PORT:8080}

# Включение плавного завершения работы (Graceful Shutdown)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Параметры сервиса для эндпоинта /health
app.service-name=${SERVICE_NAME:antipin_service_for_dodeb}
app.version=${APP_VERSION:1.0.0}

# 1. Адрес брокера (берется из переменной KAFKA_BOOTSTRAP_SERVERS)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# 2. Сериализаторы для отправки сообщений (Producer)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# Таймаут ожидания метаданных при недоступности брокера (3 секунды)
spring.kafka.producer.properties.max.block.ms=15000

# 3. Десериализаторы для чтения сообщений (Consumer)
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Протокол и механизм проверки пароля
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}

# JAAS-конфигурация: подставляет логин и пароль
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";

# Уникальное имя вашей группы потребителей
spring.kafka.consumer.group-id=${KAFKA_GROUP_ID:antipin-strategy-group}

# Откуда начинать читать при первом подключении
spring.kafka.consumer.auto-offset-reset=earliest
# Имя топика со свечами (выдает преподаватель)
app.kafka.topics.candles=${CANDLE_TOPIC:market.candles}
spring.jackson.deserialization.fail-on-unknown-properties=false


# Стандартные топики платформы
app.kafka.topics.registration-request=account.registration.request
app.kafka.topics.registration-result=account.registration.result
app.kafka.topics.heartbeat=account.service.heartbeat
app.kafka.topics.recommendations=strategy.recommendation.created

# Данные студента
app.strategy.secret-key=${SECRET_KEY:issued-by-teacher}
app.strategy.account-id=antipin-aa
app.strategy.account-name=\u0410\u043d\u0442\u0438\u043f\u0438\u043d \u0410\u043b\u0435\u043a\u0441\u0430\u043d\u0434\u0440
app.strategy.group-id=${STUDENT_GROUP_ID:group-1}
app.strategy.strategy-id=rsi-reversal
app.strategy.strategy-name=RSI Reversal Strategy